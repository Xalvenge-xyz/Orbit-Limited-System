{% extends "base.html" %}
{% block title %}Finance - ORBIT-POS{% endblock %}
{% block content %}
<div class="space-y-4">
  <div class="nasa-border bg-nasa-panel p-4 rounded-lg flex flex-col sm:flex-row gap-3 items-center">
    <select id="finPeriod" class="bg-nasa-bg border border-nasa-border rounded px-3 py-2 font-mono text-xs text-slate-300"><option value="daily">Daily</option><option value="weekly">Weekly</option><option value="monthly" selected>Monthly</option><option value="custom">Custom</option></select>
    <input type="date" id="finStart" class="bg-nasa-bg border border-nasa-border rounded px-3 py-2 font-mono text-xs text-slate-300" />
    <input type="date" id="finEnd" class="bg-nasa-bg border border-nasa-border rounded px-3 py-2 font-mono text-xs text-slate-300" />
    <label class="text-xs text-slate-400 font-mono">Safe spend % <input type="number" id="finPercent" value="30" min="10" max="80" class="w-16 bg-nasa-bg border border-nasa-border rounded px-2 py-1 font-mono text-xs text-white" /></label>
    <button id="btnFinFilter" class="px-4 py-2 bg-nasa-cyan text-black font-mono font-bold text-xs rounded">Apply</button>
    <button id="btnAddCapital" class="px-4 py-2 bg-nasa-orange text-white font-mono font-bold text-xs rounded">Add Capital</button>
  </div>
  <div id="finGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4"></div>
  <div class="nasa-border bg-nasa-panel rounded-lg overflow-hidden">
    <div class="p-4 border-b border-nasa-border text-white font-orbitron font-bold text-xs">Capital Transactions</div>
    <div class="overflow-x-auto">
      <table class="w-full text-left font-mono text-xs table-fixed">
        <thead><tr class="bg-nasa-card text-slate-400 uppercase text-[10px] border-b border-nasa-border"><th class="p-3">Date</th><th class="p-3">Type</th><th class="p-3 text-right">Amount</th><th class="p-3">Description</th></tr></thead>
        <tbody id="capitalTableBody" class="divide-y divide-nasa-border"></tbody>
      </table>
    </div>
  </div>
</div>
<div id="capitalModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
  <div class="nasa-border bg-nasa-panel rounded-lg shadow-2xl w-full max-w-md overflow-hidden font-mono text-xs">
    <div class="p-4 bg-nasa-card border-b border-nasa-border text-white font-orbitron font-bold">Capital Transaction</div>
    <form id="capitalForm" class="p-5 space-y-3">
      <div><label class="block text-slate-400 uppercase mb-1">Type</label><select name="transaction_type" class="w-full p-2 bg-nasa-bg border border-nasa-border rounded text-white"><option value="contribution">Contribution</option><option value="withdrawal">Withdrawal</option><option value="adjustment">Adjustment</option></select></div>
      <div><label class="block text-slate-400 uppercase mb-1">Amount</label><input type="number" step="0.01" name="amount" required class="w-full p-2 bg-nasa-bg border border-nasa-border rounded text-white" /></div>
      <div><label class="block text-slate-400 uppercase mb-1">Date</label><input type="date" name="transaction_date" class="w-full p-2 bg-nasa-bg border border-nasa-border rounded text-white" /></div>
      <div><label class="block text-slate-400 uppercase mb-1">Description</label><input name="description" class="w-full p-2 bg-nasa-bg border border-nasa-border rounded text-white" /></div>
      <div class="pt-2 flex justify-end gap-2">
        <button type="button" id="capitalClose" class="px-4 py-2 bg-nasa-bg border border-nasa-border rounded text-slate-400 hover:text-white">Cancel</button>
        <button type="submit" class="px-5 py-2 bg-nasa-cyan text-black font-bold rounded">Save</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
{% block extra_js %}
<script src="{{ url_for('static', filename='js/finance.js') }}"></script>
<script>document.addEventListener('DOMContentLoaded',()=>{if(window.lucide)lucide.createIcons();});</script>
{% endblock %}
