{% extends "base.html" %}
{% block title %}Expenses - ORBIT-POS{% endblock %}
{% block content %}
<div class="space-y-4">
  <div class="nasa-border bg-nasa-panel p-4 rounded-lg flex items-center justify-between">
    <h2 class="font-orbitron font-bold text-white text-base">Expense Management</h2>
    <button id="btnAddExpense" class="px-4 py-2 bg-nasa-cyan text-black font-mono font-bold text-xs rounded">Add Expense</button>
  </div>
  <div class="nasa-border bg-nasa-panel rounded-lg overflow-hidden">
    <div class="overflow-x-auto">
      <table class="w-full text-left font-mono text-xs table-fixed">
        <thead><tr class="bg-nasa-card text-slate-400 uppercase text-[10px] border-b border-nasa-border">
          <th class="p-3">Date</th><th class="p-3">Description</th><th class="p-3">Category</th><th class="p-3 text-right">Amount</th><th class="p-3">Method</th><th class="p-3">Status</th><th class="p-3 text-center">Actions</th>
        </tr></thead>
        <tbody id="expenseTableBody" class="divide-y divide-nasa-border"></tbody>
      </table>
    </div>
  </div>
</div>
<div id="expenseModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
  <div class="nasa-border bg-nasa-panel rounded-lg shadow-2xl w-full max-w-md overflow-hidden font-mono text-xs">
    <div class="p-4 bg-nasa-card border-b border-nasa-border text-white font-orbitron font-bold">Add Expense</div>
    <form id="expenseForm" class="p-5 space-y-3">
      <div><label class="block text-slate-400 uppercase mb-1">Description</label><input name="description" required class="w-full p-2 bg-nasa-bg border border-nasa-border rounded text-white" /></div>
      <div><label class="block text-slate-400 uppercase mb-1">Category</label><select name="category_id" id="expenseCategorySelect" class="w-full p-2 bg-nasa-bg border border-nasa-border rounded text-white"></select></div>
      <div><label class="block text-slate-400 uppercase mb-1">Amount</label><input type="number" step="0.01" name="amount" required class="w-full p-2 bg-nasa-bg border border-nasa-border rounded text-white" /></div>
      <div><label class="block text-slate-400 uppercase mb-1">Date</label><input type="date" name="expense_date" class="w-full p-2 bg-nasa-bg border border-nasa-border rounded text-white" /></div>
      <div><label class="block text-slate-400 uppercase mb-1">Payment Method</label><select name="payment_method" class="w-full p-2 bg-nasa-bg border border-nasa-border rounded text-white"><option value="cash">Cash</option><option value="card">Card</option><option value="bank">Bank</option></select></div>
      <div><label class="block text-slate-400 uppercase mb-1">Notes</label><textarea name="notes" class="w-full p-2 bg-nasa-bg border border-nasa-border rounded text-white"></textarea></div>
      <div class="pt-2 flex justify-end gap-2">
        <button type="button" id="expenseClose" class="px-4 py-2 bg-nasa-bg border border-nasa-border rounded text-slate-400 hover:text-white">Cancel</button>
        <button type="submit" class="px-5 py-2 bg-nasa-cyan text-black font-bold rounded">Save</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
{% block extra_js %}
<script src="{{ url_for('static', filename='js/expenses.js') }}"></script>
<script>document.addEventListener('DOMContentLoaded',()=>{if(window.lucide)lucide.createIcons();});</script>
{% endblock %}
