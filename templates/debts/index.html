{% extends "base.html" %}
{% block title %}Debts - ORBIT-POS{% endblock %}
{% block content %}
<div class="space-y-4">
  <div class="nasa-border bg-nasa-panel p-4 rounded-lg flex items-center justify-between">
    <h2 class="font-orbitron font-bold text-white text-base">Debts / Utang</h2>
    <button id="btnAddDebt" class="px-4 py-2 bg-nasa-orange text-white font-mono font-bold text-xs rounded">Add Debt</button>
  </div>
  <div class="nasa-border bg-nasa-panel p-4 rounded-lg flex flex-col sm:flex-row gap-3 items-center">
    <select id="debtType" class="bg-nasa-bg border border-nasa-border rounded px-3 py-2 font-mono text-xs text-slate-300"><option value="">All</option><option value="receivable">Receivable</option><option value="payable">Payable</option></select>
    <select id="debtStatus" class="bg-nasa-bg border border-nasa-border rounded px-3 py-2 font-mono text-xs text-slate-300"><option value="">All status</option><option value="unpaid">Unpaid</option><option value="partial">Partial</option><option value="paid">Paid</option></select>
  </div>
  <div class="nasa-border bg-nasa-panel rounded-lg overflow-hidden">
    <div class="overflow-x-auto">
      <table class="w-full text-left font-mono text-xs table-fixed">
        <thead><tr class="bg-nasa-card text-slate-400 uppercase text-[10px] border-b border-nasa-border">
          <th class="p-3">Name</th><th class="p-3">Type</th><th class="p-3 text-right">Amount</th><th class="p-3 text-right">Paid</th><th class="p-3 text-right">Balance</th><th class="p-3">Status</th><th class="p-3">Due</th><th class="p-3 text-center">Actions</th>
        </tr></thead>
        <tbody id="debtTableBody" class="divide-y divide-nasa-border"></tbody>
      </table>
    </div>
  </div>
</div>
<!-- modals omitted for brevity; keep existing JS hooks -->
<div id="debtModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
  <div class="nasa-border bg-nasa-panel rounded-lg shadow-2xl w-full max-w-md overflow-hidden font-mono text-xs">
    <div class="p-4 bg-nasa-card border-b border-nasa-border text-white font-orbitron font-bold">Add Debt</div>
    <form id="debtForm" class="p-5 space-y-3">
      <div><label class="block text-slate-400 uppercase mb-1">Name</label><input name="name" required class="w-full p-2 bg-nasa-bg border border-nasa-border rounded text-white" /></div>
      <div><label class="block text-slate-400 uppercase mb-1">Type</label><select name="debt_type" class="w-full p-2 bg-nasa-bg border border-nasa-border rounded text-white"><option value="receivable">Receivable (Customer)</option><option value="payable">Payable (Supplier)</option></select></div>
      <div><label class="block text-slate-400 uppercase mb-1">Amount</label><input type="number" step="0.01" name="amount" required class="w-full p-2 bg-nasa-bg border border-nasa-border rounded text-white" /></div>
      <div><label class="block text-slate-400 uppercase mb-1">Debt Date</label><input type="date" name="debt_date" class="w-full p-2 bg-nasa-bg border border-nasa-border rounded text-white" /></div>
      <div><label class="block text-slate-400 uppercase mb-1">Due Date</label><input type="date" name="due_date" class="w-full p-2 bg-nasa-bg border border-nasa-border rounded text-white" /></div>
      <div><label class="block text-slate-400 uppercase mb-1">Notes</label><textarea name="notes" class="w-full p-2 bg-nasa-bg border border-nasa-border rounded text-white"></textarea></div>
      <div class="pt-2 flex justify-end gap-2">
        <button type="button" id="debtClose" class="px-4 py-2 bg-nasa-bg border border-nasa-border rounded text-slate-400 hover:text-white">Cancel</button>
        <button type="submit" class="px-5 py-2 bg-nasa-cyan text-black font-bold rounded">Save</button>
      </div>
    </form>
  </div>
</div>
<div id="paymentModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
  <div class="nasa-border bg-nasa-panel rounded-lg shadow-2xl w-full max-w-md overflow-hidden font-mono text-xs">
    <div class="p-4 bg-nasa-card border-b border-nasa-border text-white font-orbitron font-bold">Record Payment</div>
    <form id="paymentForm" class="p-5 space-y-3">
      <input type="hidden" name="debt_id" />
      <div><label class="block text-slate-400 uppercase mb-1">Amount</label><input type="number" step="0.01" name="amount" required class="w-full p-2 bg-nasa-bg border border-nasa-border rounded text-white" /></div>
      <div><label class="block text-slate-400 uppercase mb-1">Date</label><input type="date" name="payment_date" class="w-full p-2 bg-nasa-bg border border-nasa-border rounded text-white" /></div>
      <div><label class="block text-slate-400 uppercase mb-1">Method</label><select name="method" class="w-full p-2 bg-nasa-bg border border-nasa-border rounded text-white"><option value="cash">Cash</option><option value="bank">Bank</option></select></div>
      <div><label class="block text-slate-400 uppercase mb-1">Notes</label><input name="notes" class="w-full p-2 bg-nasa-bg border border-nasa-border rounded text-white" /></div>
      <div class="pt-2 flex justify-end gap-2">
        <button type="button" id="paymentClose" class="px-4 py-2 bg-nasa-bg border border-nasa-border rounded text-slate-400 hover:text-white">Cancel</button>
        <button type="submit" class="px-5 py-2 bg-nasa-cyan text-black font-bold rounded">Record</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
{% block extra_js %}
<script src="{{ url_for('static', filename='js/debts.js') }}"></script>
<script>document.addEventListener('DOMContentLoaded',()=>{if(window.lucide)lucide.createIcons();});</script>
{% endblock %}
