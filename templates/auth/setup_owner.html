{% extends "base.html" %}
{% block title %}Setup Owner - ORBIT{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>Initial Owner Setup</h1>
  <p class="muted">Creates the first administrator account.</p>
  <form method="post" class="form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
    <label>Full Name <input type="text" name="full_name" required /></label>
    <label>Email <input type="email" name="email" required /></label>
    <label>Mobile <input type="text" name="mobile" /></label>
    <label>Password <input type="password" name="password" required minlength="8" /></label>
    <label>Confirm Password <input type="password" name="confirm" required minlength="8" /></label>
    <button type="submit" class="btn btn-primary">Create Owner</button>
  </form>
</div>
{% endblock %}
