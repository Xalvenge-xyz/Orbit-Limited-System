{% extends "base.html" %}
{% block title %}Forgot Password - ORBIT-POS{% endblock %}
{% block content %}
<div class="flex items-center justify-center min-h-[60vh]">
  <div class="nasa-border bg-nasa-panel rounded-lg shadow-2xl w-full max-w-md overflow-hidden font-mono text-xs">
    <div class="p-4 bg-nasa-card border-b border-nasa-border text-white font-orbitron font-bold">Forgot Password</div>
    <form method="post" class="p-5 space-y-4">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
      <div><label class="block text-slate-400 uppercase mb-1">Email</label><input type="email" name="email" required class="w-full p-2.5 bg-nasa-bg border border-nasa-border rounded text-white focus:border-nasa-cyan focus:outline-none" /></div>
      <div class="pt-2 flex justify-end"><button type="submit" class="px-5 py-2 bg-nasa-cyan text-black font-bold rounded">Send Reset Link</button></div>
    </form>
    <div class="p-4 border-t border-nasa-border text-[11px] text-slate-400 font-mono"><a href="{{ url_for('auth.login') }}" class="text-nasa-cyan hover:underline">Back to login</a></div>
  </div>
</div>
{% endblock %}
