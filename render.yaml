services:
  - type: web
    name: orbit-pos
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && python -c "from app import create_app; from backend.extensions import db; a=create_app(); ctx=a.app_context(); ctx.push(); db.create_all(); ctx.pop(); print('DB tables created')"
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: FLASK_APP
        value: app.py
      - key: FLASK_ENV
        value: production
      - key: RENDER
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: MAIL_SERVER
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USE_TLS
        value: "true"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_DEFAULT_SENDER
        sync: false

databases:
  - name: orbit-pos-db
    plan: free
    databaseName: orbit_pos
    user: orbit